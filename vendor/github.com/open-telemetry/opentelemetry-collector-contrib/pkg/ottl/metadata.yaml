type: ottl

status:
  class: pkg
  stability:
    development: [ profiles ]
    stable: [ traces, metrics, logs ]
  codeowners:
    active: [TylerHelmuth, evan-bradley, edmocosta]
    emeritus: [anuraaga, kentquirk, bogdandrutu]
    seeking_new: true

feature_gates:
  - id: "ottl.functions.enableLambda"
    description: Allow OTTL functions to take lambda arguments. When disabled, lambda arguments are rejected.
    stage: alpha
    from_version: v0.155.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/48227

  - id: "pkg.ottl.functions.enableDynamicSliceArguments"
    description: Allow slice arguments of stable OTTL functions, such as the values of Concat, to be paths or converters that resolve to a slice at runtime. When disabled, these arguments only accept list literals.
    stage: beta
    from_version: v0.163.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/27821

  - id: "pkg.ottl.functions.enableExperimental"
    description: Allow OTTL statements and conditions to use experimental functions. When disabled, experimental functions are rejected.
    stage: alpha
    from_version: v0.163.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/50927
