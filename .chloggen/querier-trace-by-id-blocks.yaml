component: querier
note: Deprecate querier blocklist polling. Query-frontends now send the blocks to search with each trace by ID job.
issues: []
subtext: |
  Upgrade query-frontends and queriers in any order, then set `querier.blocklist_polling_enabled: false` on queriers.
  Setting it before the upgrade fails startup on older versions, which reject the unknown key.
