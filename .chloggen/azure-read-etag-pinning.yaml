# (Optional) Additional lines rendered under the note. Use a pipe (|) for multiline text.
subtext: Azure reads now pin the ETag from GetProperties on every ranged GET, so a concurrent overwrite returns a retryable error instead of a buffer stitched together from two blob generations.

