# Changelog entry. Generate a copy with `make chlog-new`, then fill in the fields.

# One of: breaking | change | feature | enhancement | bug_fix | security
change_type: feature

# Component or area of the change. Must be one of the components in .chloggen/config.yaml,
# e.g. distributor, querier, query-frontend, storage, operations.
component: distributor

# A brief description of the change. Surround with quotes ("") if it must start with a backtick (`).
note: Derive ingestion rate limits from tenant metadata carried in the `X-Scope-OrgID` header (`tenant:key=value`), so several writers can share one tenant with separate ingestion budgets.

# (Optional) PR number(s), e.g. [7339]. Leave blank to auto-fill at release. See
# .chloggen/README.md.
issues: []

# (Optional) Additional lines rendered under the note. Use a pipe (|) for multiline text.
subtext: |
  Per-tenant override entries keyed `":key=value"`, `"tenant:key=value"` or the full value overlay
  `ingestion.rate_limit_bytes` and `ingestion.burst_size_bytes` on the tenant's limits, and every
  distinct value gets its own token bucket. Data, queries, metrics and all other limits keep using
  the tenant ID alone. Org IDs with malformed metadata, such as `tenant:garbage`, are now rejected
  with `InvalidArgument` instead of being accepted as `tenant`. Rate limiters unused for 24 hours
  are now removed from memory.

# The GitHub handle (without the leading @) of the change's author. Rendered as "(@handle)".
user: CmdrSharp
