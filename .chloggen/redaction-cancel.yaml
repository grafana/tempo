change_type: enhancement
component: backend-scheduler
note: add CancelRedaction — cancel an in-progress redaction for a tenant (`tempo-cli redact-cancel`). It purges the not-yet-started job backlog and stops holding the tenant's compaction disabled; jobs already in flight finish, so block in:out stays 1:1. The tenant is sourced from the request header, so it is tenant-scoped and safe alongside concurrent per-tenant redactions.
