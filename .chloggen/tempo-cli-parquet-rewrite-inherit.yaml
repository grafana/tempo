change_type: enhancement
component: tempo-cli
note: Allow `parquet rewrite` to override the row group size and bloom filter parameters, inheriting the input block's bloom filter settings by default.
issues: []
subtext: |
  `parquet rewrite` now accepts `--row-group-size-bytes`, `--bloom-fp` and `--bloom-shard-size-bytes`.
  The bloom filter parameters are inherited from the input block when not set; the row group size
  falls back to the 100MB Tempo default with a warning.
  The vParquet3/vParquet4 block iterators used by the conversion commands no longer drop the final trace.
user: mapno