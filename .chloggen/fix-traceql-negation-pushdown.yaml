# Changelog entry. Generate a copy with `make chlog-new`, then fill in the fields.

# One of: breaking | change | feature | enhancement | bug_fix | security
change_type: bug_fix

# Component or area of the change. Must be one of the components in .chloggen/config.yaml,
# e.g. distributor, querier, query-frontend, storage, operations.
component: traceql

# A brief description of the change. Surround with quotes ("") if it must start with a backtick (`).
note: "Fix negated expressions such as `{ !(name = \"foo\") }` returning the wrong spans in search and metrics queries."

# (Optional) PR number(s), e.g. [7339]. Leave blank to auto-fill at release. See
# .chloggen/README.md.
issues: []

# (Optional) Additional lines rendered under the note. Use a pipe (|) for multiline text.
subtext: |
  The negation was pushed down to storage without being negated, so search returned no results
  and metrics queries counted the spans that should have been excluded.
  Negations are now pushed down to the comparisons with De Morgan's laws, which also speeds them up.
  Like NULL in SQL, a comparison with a missing attribute or a mismatched type doesn't match, and neither does its negation.
  `{ !(span.foo = "a") }` no longer matches spans without `span.foo`. Use `{ span.foo = nil }` for those.
  Set the query hint `skip_ast_transformations` to `demorgan` to evaluate negations as written.

# The GitHub handle (without the leading @) of the change's author. Rendered as "(@handle)".
user: mdisibio
