# (Optional) Additional lines rendered under the note. Use a pipe (|) for multiline text.
subtext: |
  One table shows each backend-scheduler job type and the other shows each backend-worker. Compaction shows "Idle" instead of Late or Very late when there are no outstanding blocks. Requires the `last_successful_job_timestamp_seconds` gauges added in the same release.

# The GitHub handle (without the leading @) of the change's author. Rendered as "(@handle)".
