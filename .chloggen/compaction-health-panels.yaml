# A brief description of the change. Surround with quotes ("") if it must start with a backtick (`).
note: Add compactor health tables to the Compactions row of the `Tempo - Backend Work` dashboard. They show how long it has been since compaction and retention last succeeded, as Ok, Delayed, Late, or Very late.

# (Optional) PR number(s), e.g. [7339]. Leave blank to auto-fill at release. See
# .chloggen/README.md.
