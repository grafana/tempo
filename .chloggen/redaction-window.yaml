change_type: enhancement
component: backend-scheduler
note: redaction accepts an optional `[start, end]` time window (`tempo-cli redact --start/--end`), so a large tenant can be redacted in time slices instead of one all-blocks pass.
issues: []
subtext: |
  A redaction holds the tenant's compaction off for its whole run, so a single pass over every block keeps compaction paused long enough for the block list to grow. Slicing lets compaction recover in between.

  Only blocks overlapping the window are read. With `--query` the window also bounds the scan inside each block; with `--trace-id` the listed traces are removed from every selected block regardless of their own timestamps. Both bounds are required together — a one-sided window is rejected, because the storage layer applies its per-trace filter only when both are set. The CLI accepts `now`, `now-7d` or RFC3339 and resolves to absolute time at submission, so a long run never drifts into newer data.
