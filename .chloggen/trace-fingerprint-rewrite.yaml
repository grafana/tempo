# A brief description of the change. Surround with quotes ("") if it must start with a backtick (`).
note: Add `--fingerprint` and `--fingerprint-report` to `tempo-cli parquet rewrite` to write v1 trace fingerprints into vParquet5 blocks and measure their size, cost and accuracy.

# (Optional) PR number(s), e.g. [7339]. Leave blank to auto-fill at release. See
# .chloggen/README.md.
issues: [8513]

# (Optional) Additional lines rendered under the note. Use a pipe (|) for multiline text.
subtext: Blocks that already have fingerprints can now be rewritten, with an explicit choice. `--fingerprint=v1` recomputes the fingerprints from the traces and never copies them from the input block, and `--fingerprint=none` drops them. A block written with fingerprints is flagged nocompact, because compaction does not recompute them when it merges traces. The rewrite now refuses an output block directory that already exists, which could be its own input.

