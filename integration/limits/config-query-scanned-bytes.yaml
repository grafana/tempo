query_frontend:
  query_end_cutoff: 0s # required so query_end_cutoff <= query_backend_after
  search:
    query_backend_after: 0s # every block counts against the budget
    max_scanned_bytes: 1 # any backend block is over budget
    min_duration: 10m
    max_duration: 2h
  metrics:
    query_backend_after: 0s
    max_scanned_bytes: 1
    min_duration: 10m
    max_duration: 2h
