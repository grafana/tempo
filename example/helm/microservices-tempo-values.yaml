---
global:
  clusterDomain: 'cluster.local'
gateway:
  enabled: true
ingest:
  kafka:
    address: 'kafka:9092'
    auto_create_topic_default_partitions: 1
blockBuilder:
  replicas: 1
liveStore:
  replicas: 1
storage:
  trace:
    backend: s3
    s3:
      access_key: 'grafana-tempo'
      secret_key: 'supersecret'
      bucket: 'tempo-traces'
      endpoint: 'rustfs:9000'
      insecure: true
traces:
  otlp:
    http:
      enabled: true
    grpc:
      enabled: true
distributor:
  config:
    log_received_spans:
      enabled: true
    log_discarded_spans:
      enabled: true
