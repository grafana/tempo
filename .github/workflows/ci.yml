name: CI
on:
  pull_request:
# Requiring certain checks for PRs to be merge-able in Github, forces for those checks to be *always* run.
# Even if the changes do not require them (i.e. the paths indicated below). That's why `paths-ignore` is commented out.
#
#    paths-ignore:
#      - 'docs/**'
#      - 'example/**'
#      - 'tools/**'

concurrency:
  # Cancel any running workflow for the same branch when new commits are pushed.
  # We group both by ref_name (available when CI is triggered by a push to a branch/tag)
  # and head_ref (available when CI is triggered by a PR).
  group: "${{ github.ref_name }}-${{ github.head_ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:

      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: "0"
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: check-fmt
        run: make check-fmt

      - name: check-jsonnetfmt
        run: make check-jsonnetfmt

      - name: Get year and week number
        id: get-year-week-number
        run: echo "date=$(date +"%Yweek%U")" >> "$GITHUB_OUTPUT"

      - name: cache golangci
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ steps.get-year-week-number.outputs.date }}-${{ hashFiles('go.mod', '.golangci.yml') }}

      - name: lint
        # using env instead of template expansions to avoid template injection
        # https://woodruffw.github.io/zizmor/audits/#template-injection
        run: |
          make lint "base=origin/${BASE_REF}"
          sudo chown -R "$(id -u):$(id -g)" .cache/golangci-lint  # needed to archive cache
        env:
          BASE_REF: ${{ github.base_ref }}

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-target:
          [
            test-with-cover-pkg,
            test-with-cover-tempodb,
            test-with-cover-tempodb-wal,
            test-with-cover-tempodb-encoding,
            test-with-cover-generator,
            test-with-cover-livestore,
            test-with-cover-blockbuilder,
            test-with-cover-others,
          ]

    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          # cache managed below instead: setup-go keys on go.sum alone, so once that key
          # exists it never re-saves and the -race build output never gets cached.
          cache: false

      - name: Get year and week number
        id: get-year-week-number
        run: echo "date=$(date +"%Yweek%U")" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}

      - name: Cache Go build output
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # one cache shared by the whole matrix: a -race build cache is ~1.1GB per target, so
          # per-target caches would blow the 10GB repo limit. Targets overlap heavily anyway.
          # Rotated weekly so the saved cache keeps up with the code instead of freezing.
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-unit-${{ steps.get-year-week-number.outputs.date }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-unit-${{ steps.get-year-week-number.outputs.date }}-
            gobuild-${{ runner.os }}-unit-

      - name: Run Tests
        run: make ${{ matrix.test-target }}

      - name: List coverage artifacts
        run: ls .coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.test-target }}
          path: .coverage/*.out
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  integration-tests-validation:
    name: Validate integration test coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Validate all integration folders are covered by CI
        run: |
          # Define expected test folders, relative to integration/, that have corresponding
          # test-e2e-* targets. A nested folder maps to its target by replacing / with -,
          # so api/search is run by test-e2e-api-search.
          EXPECTED_FOLDERS=("api/metrics" "api/misc" "api/overrides" "api/search" "api/tracebyid" "limits" "metrics-generator" "operations" "storage" "util")

          # Get the actual folders holding tests. Matching on test files rather than on
          # first-level directories means a nested package like api/<area> is checked too,
          # and that container directories and test scratch dirs are skipped.
          mapfile -d '' _raw < <(find integration -mindepth 1 -type d -not -name '.*' -print0 2>/dev/null)
          ACTUAL_FOLDERS=()
          for _d in "${_raw[@]}"; do
            ls "$_d"/*_test.go >/dev/null 2>&1 || continue
            ACTUAL_FOLDERS+=("${_d#integration/}")
          done

          # Convert arrays to strings for comparison
          EXPECTED_SORTED=$(printf '%s\n' "${EXPECTED_FOLDERS[@]}" | sort | tr '\n' ' ')
          ACTUAL_SORTED=$(printf '%s\n' "${ACTUAL_FOLDERS[@]}" | sort | tr '\n' ' ')

          if [ "$EXPECTED_SORTED" != "$ACTUAL_SORTED" ]; then
            echo "❌ ERROR: Integration folder mismatch detected!"
            echo ""
            echo "Expected folders (covered by CI):"
            printf '  - %s\n' "${EXPECTED_FOLDERS[@]}" | sort
            echo ""
            echo "Actual folders in ./integration:"
            printf '  - %s\n' "${ACTUAL_FOLDERS[@]}" | sort
            echo ""
            echo "If you added a new integration test folder, you must:"
            echo "  1. Add a corresponding 'test-e2e-<folder-name>' target to the Makefile,"
            echo "     replacing / with - for a nested folder (api/search -> test-e2e-api-search)"
            echo "  2. Add the target to the matrix in .github/workflows/ci.yml (integration-tests job)"
            echo "  3. Update the EXPECTED_FOLDERS list in this validation step"
            exit 1
          fi

          echo "✅ All integration folders are covered by CI"

  build-e2e-images:
    name: Build e2e test images
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
      - name: Build images
        run: make docker-tempo docker-tempo-query
      # every integration-tests matrix job used to rebuild these images from scratch (~2-3min
      # each, every job, every run) - build once here and share via artifact instead.
      - name: Save images
        run: docker save grafana/tempo tempo grafana/tempo-query tempo-query -o /tmp/tempo-e2e-images.tar
      - name: Upload images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tempo-e2e-images
          path: /tmp/tempo-e2e-images.tar
          retention-days: 1

  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-24.04
    needs: [integration-tests-validation, build-e2e-images]
    strategy:
      fail-fast: false
      matrix:
        test-target:
          [
            test-e2e-operations,
            test-e2e-api-search,
            test-e2e-api-metrics,
            test-e2e-api-overrides,
            test-e2e-api-misc,
            test-e2e-api-tracebyid,
            test-e2e-limits,
            test-e2e-metrics-generator,
            test-e2e-storage,
            test-e2e-util,
          ]

    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Fetch tags
        run: git fetch --prune --unshallow --tags
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          # cache managed below instead, see the unit-tests job
          cache: false
      - name: Get year and week number
        id: get-year-week-number
        run: echo "date=$(date +"%Yweek%U")" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
      - name: Cache Go build output
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-e2e-${{ steps.get-year-week-number.outputs.date }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-e2e-${{ steps.get-year-week-number.outputs.date }}-
            gobuild-${{ runner.os }}-e2e-
      - name: Download e2e images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tempo-e2e-images
          path: /tmp
      - name: Load e2e images
        run: docker load -i /tmp/tempo-e2e-images.tar
      - name: Run Tests
        run: make ${{ matrix.test-target }}
        env:
          SKIP_DOCKER_BUILD: "1"

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Build Tempo
        run: make tempo

      - name: generate-manifest
        run: make generate-manifest

      - name: Build tempo-query
        run: make tempo-query

      - name: Build vulture
        run: make tempo-vulture

      - name: Build tempo-cli
        run: make tempo-cli

      - name: Verify packaged and example configs
        run: make check-configs

  build-riscv64:
    name: Build (riscv64 cross-compilation)
    runs-on: ubuntu-24.04
    env:
      GOARCH: riscv64
      GOOS: linux
      CGO_ENABLED: "0"
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Build Tempo
        run: make tempo

      - name: Build tempo-query
        run: make tempo-query

      - name: Build vulture
        run: make tempo-vulture

      - name: Build tempo-cli
        run: make tempo-cli

  vendor-check:
    name: Vendor check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Check vendor
        run: make vendor-check

  tempo-jsonnet:
    name: Check jsonnet & tempo-mixin
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Check jsonnet
        run: make jsonnet-check

      - name: Check tempo-mixin
        run: make tempo-mixin-check

      - name: Test jsonnet
        run: make jsonnet-test

  build-technical-documentation:
    name: Build technical documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Build Website
        run: docker run -v "${PWD}/docs/sources:/hugo/content/docs/tempo/latest" --rm grafana/docs-base:latest make prod

  coverage-annotations:
    name: Coverage Annotations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [unit-tests]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0  # Fetch full history for proper diff computation

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: .coverage/
          merge-multiple: true

      - name: Annotate uncovered lines in PR diff
        uses: grafana/shared-workflows/actions/annotate-coverage@ccd82960521026200c6b51f6c61100732a1a62f3 # annotate-coverage/v0.2.0
        with:
          coverage-path: .coverage
          format: GitHubAnnotations
          base-ref: ${{ github.event.pull_request.base.sha }}
          commit-sha: ${{ github.event.pull_request.head.sha }}
