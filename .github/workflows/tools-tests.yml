# Runs the unit tests for the separate Go modules that the main CI unit-tests
# job does not cover: `tools` (tools/go.mod) and the code-owner sweep module
# (.github/scripts). Runs on every PR (no path filter) so they can be required
# status checks without blocking PRs that don't touch them.
name: Tools and GitHub Scripts Unit Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tools-tests:
    name: Run tools unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'tools/go.mod'

      - name: Run tools unit tests
        working-directory: tools
        run: go test ./...

      - name: Run version-tag tests
        run: ./tools/version-tag_test.sh

  github-scripts-test:
    name: Run .github/scripts tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.github/scripts/go.mod'

      - name: Vet the module
        working-directory: .github/scripts
        run: go vet ./...

      - name: Run the sweep unit tests
        working-directory: .github/scripts
        run: go test -race ./...
