name: SBOM on Release

# Attaches a Socket-generated SPDX SBOM to a Tempo GitHub release.
#
# This is deliberately not triggered by `on: release: published`. release-tag.yml publishes the
# draft release created by goreleaser with secrets.GITHUB_TOKEN, and GitHub does not start new
# workflow runs for events produced by the default GITHUB_TOKEN, so that trigger would never
# fire. release-tag.yml calls this workflow explicitly once its `publish` job has finished.
# Run it by hand with workflow_dispatch to (re)generate the SBOM for an existing release.
on:
  workflow_call:
    inputs:
      version:
        required: true
        description: The release tag to export an SBOM for, with or without a leading `v` (e.g. v3.1.0 or v3.2.0-rc.1)
        type: string
      dry_run:
        required: false
        default: false
        description: Generate the SBOM but do not upload it to the release
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: The release tag to export an SBOM for, with or without a leading `v` (e.g. v3.1.0 or v3.2.0-rc.1)
        type: string
      dry_run:
        required: false
        default: false
        description: Generate the SBOM but do not upload it to the release
        type: boolean

permissions: {}

jobs:
  export-sbom:
    name: Export SBOM and attach to release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to upload the SBOM as a release asset
      id-token: write # to authenticate to Vault
    steps:
      # Release candidates (-rc.N) are cut from main; minor and patch releases are cut from
      # release-vX.Y (see release-tag.yml). The branch is only the label Socket files the scan
      # under; the files scanned come from the tag checked out below.
      - name: Resolve tag and Socket branch
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bare="${VERSION#v}"
          if ! echo "$bare" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "ERROR: '$VERSION' is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          if echo "$bare" | grep -q -- '-rc\.'; then
            branch="main"
          else
            branch="release-v${bare%.*}"
          fi
          {
            echo "tag=v${bare}"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"

      # Socket scans the manifests on disk, so check out the exact tag being released.
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Get Socket API token from Vault
        id: vault-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@e46fe1e9a2bf9e618bcf8d8d32f3a7381b45c06d # get-vault-secrets/v2.0.0
        with:
          common_secrets: |
            SOCKET_API_TOKEN=socket:SOCKET_API_KEY

      - name: Export SPDX SBOM from Socket
        id: export-sbom
        uses: grafana/shared-workflows/actions/socket-export-sbom@73f73d35ceadf46221741d45faefec0c5a990e6b # socket-export-sbom/v1.0.0
        with:
          socket_api_token: ${{ fromJSON(steps.vault-secrets.outputs.secrets).SOCKET_API_TOKEN }}
          socket_org: grafana
          branch: ${{ steps.version.outputs.branch }}
          output_file: ${{ github.event.repository.name }}-${{ steps.version.outputs.tag }}.spdx.json

      - name: Upload SBOM to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          SBOM_PATH: ${{ steps.export-sbom.outputs.path }}
        run: gh release upload "$TAG" "$SBOM_PATH" --clobber
